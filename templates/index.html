<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة نتائج الطلاب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container">
        <h2 class="mb-4 text-center">لوحة استخراج ومتابعة نتائج الطلاب</h2>

        <div class="card p-4 mb-4 shadow-sm">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">بداية رقم الجلوس</label>
                    <input type="number" id="startSeat" class="form-control" value="2910001">
                </div>
                <div class="col-md-4">
                    <label class="form-label">نهاية رقم الجلوس</label>
                    <input type="number" id="endSeat" class="form-control" value="2910050">
                </div>
                <div class="col-md-4 d-flex align-items-end gap-2">
                    <button id="btnStart" class="btn btn-primary w-100" onclick="startScraper()">بدء السحب</button>
                    <button id="btnStop" class="btn btn-danger w-100" onclick="stopScraper()" disabled>إيقاف</button>
                </div>
            </div>
            <div class="mt-3">
                <span class="fw-bold">الحالة: </span><span id="statusText" class="badge bg-secondary">إنتظار</span>
            </div>
        </div>

        <div class="card p-3 shadow-sm">
            <h5 class="card-title mb-3">النتائج المرتبة (إجمالي الناجحين: <span id="foundCount">0</span>)</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>الترتيب</th>
                            <th>رقم الجلوس</th>
                            <th>الاسم</th>
                            <th>المجموع</th>
                            <th>النسبة</th>
                            <th>التقدير</th>
                            <th>النوع</th>
                            <th>الشعبة</th>
                            <th>المدرسة</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTable">
                        <tr><td colspan="9" class="text-center">لا توجد بيانات للعرض</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let pollInterval = null;

        async function startScraper() {
            const startSeat = document.getElementById("startSeat").value;
            const endSeat = document.getElementById("endSeat").value;

            const res = await fetch("/api/start", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ start_seat: startSeat, end_seat: endSeat })
            });

            if (res.ok) {
                document.getElementById("btnStart").disabled = true;
                document.getElementById("btnStop").disabled = false;
                if (!pollInterval) pollInterval = setInterval(updateStatus, 1500);
            }
        }

        async function stopScraper() {
            await fetch("/api/stop", { method: "POST" });
            document.getElementById("btnStart").disabled = false;
            document.getElementById("btnStop").disabled = true;
        }

        async function updateStatus() {
            const res = await fetch("/api/status");
            const data = await res.json();

            document.getElementById("statusText").innerText = data.status_message;
            document.getElementById("foundCount").innerText = data.total_found;

            const tbody = document.getElementById("resultsTable");
            if (data.results.length > 0) {
                tbody.innerHTML = data.results.map((item, index) => `
                    <tr>
                        <td><strong>${index + 1}</strong></td>
                        <td>${item.seat_no}</td>
                        <td>${item.name}</td>
                        <td><span class="badge bg-primary">${item.score}</span></td>
                        <td><span class="badge bg-success">${item.pct_str}</span></td>
                        <td>${item.grade}</td>
                        <td>${item.division}</td>
                        <td>${item.specialization}</td>
                        <td>${item.school}</td>
                    </tr>
                `).join("");
            }

            if (!data.is_running) {
                document.getElementById("btnStart").disabled = false;
                document.getElementById("btnStop").disabled = true;
            }
        }
        updateStatus();
        setInterval(updateStatus, 3000);
    </script>
</body>
</html>
